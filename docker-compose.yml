services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?defina SA_PASSWORD no .env (veja .env.example)}"
    ports: ["${SQLSERVER_PORT:-1433}:1433"]
    volumes: ["sqlserver-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    # O nÃƒÂ³ do RabbitMQ guarda os dados sob o hostname: precisa ser estÃƒÂ¡vel para o volume ser reaproveitado.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?defina RABBITMQ_USER no .env (veja .env.example)}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env (veja .env.example)}"
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # Sem "ports" nem container_name: cada API pode ter vÃƒÂ¡rias rÃƒÂ©plicas (docker compose up --scale lancamentos-api=N)
  # e sÃƒÂ³ ÃƒÂ© alcanÃƒÂ§ada pelo gateway.
  lancamentos-api:
    build: { context: ., args: { PROJECT: Verx.Lancamentos.Api } }
    restart: unless-stopped
    deploy: { replicas: 2 }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=VerxLancamentos;User Id=sa;Password=${SA_PASSWORD:?defina SA_PASSWORD no .env (veja .env.example)};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?defina JWT_KEY no .env (veja .env.example)}"
      Jwt__Admins__0: "${ADMIN_EMAIL:-demo@verx.com}"
      Auth__DemoSenha: "${DEMO_PASSWORD:-}"
      Cors__Origins__0: "http://localhost:${WEB_PORT:-4200}"
    healthcheck: &api-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      retries: 6
      start_period: 20s
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  consolidado-api:
    build: { context: ., args: { PROJECT: Verx.Consolidado.Api } }
    restart: unless-stopped
    deploy: { replicas: 2 }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=VerxConsolidado;User Id=sa;Password=${SA_PASSWORD:?defina SA_PASSWORD no .env (veja .env.example)};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?defina JWT_KEY no .env (veja .env.example)}"
      Cors__Origins__0: "http://localhost:${WEB_PORT:-4200}"
    healthcheck: *api-health
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Entrada ÃƒÂºnica das APIs. As portas do host sÃƒÂ£o configurÃƒÂ¡veis; o front-end aponta para 5101 e 5102 (api.service.ts),
  # entÃƒÂ£o ao mudÃƒÂ¡-las ajuste tambÃƒÂ©m as constantes de lÃƒÂ¡.
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["${LANCAMENTOS_PORT:-5101}:5101", "${CONSOLIDADO_PORT:-5102}:5102"]
    volumes: ["./ops/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      lancamentos-api: { condition: service_healthy }
      consolidado-api: { condition: service_healthy }

  web:
    build: ./web
    restart: unless-stopped
    ports: ["${WEB_PORT:-4200}:80"]
    depends_on: [gateway]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - "./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus-data:/prometheus"
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

volumes:
  sqlserver-data:
  rabbitmq-data:
  prometheus-data:
