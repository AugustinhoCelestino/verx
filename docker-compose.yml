services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Verx@Pass123"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Verx@Pass123' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  lancamentos-api:
    build: { context: ., args: { PROJECT: Verx.Lancamentos.Api } }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=VerxLancamentos;User Id=sa;Password=Verx@Pass123;TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
    ports: ["5101:8080"]
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  consolidado-api:
    build: { context: ., args: { PROJECT: Verx.Consolidado.Api } }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=VerxConsolidado;User Id=sa;Password=Verx@Pass123;TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
    ports: ["5102:8080"]
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  web:
    build: ./web
    ports: ["4200:80"]
    depends_on: [lancamentos-api, consolidado-api]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
