# Gateway do compose: ponto único de entrada que distribui as requisições entre as réplicas de cada API.
# O DNS interno do Docker devolve o IP de todas as réplicas; "valid=5s" faz o nginx enxergar réplicas novas ou reiniciadas.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 5101;
    set $alvo http://lancamentos-api:8080;
    location / {
        proxy_pass $alvo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

server {
    listen 5102;
    set $alvo http://consolidado-api:8080;
    location / {
        proxy_pass $alvo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
