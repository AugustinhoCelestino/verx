name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # auditoria semanal: novas vulnerabilidades surgem sem mudança de código

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Verx.sln
      - run: dotnet build Verx.sln --no-restore -c Release
      - run: dotnet test Verx.sln --no-build -c Release --logger "trx;LogFileName=resultado.trx"
      - name: Falha se houver pacote NuGet vulnerável (diretos e transitivos)
        run: |
          dotnet list Verx.sln package --vulnerable --include-transitive 2>&1 | tee vulnerabilidades.txt
          if grep -q "has the following vulnerable packages" vulnerabilidades.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes-dotnet
          path: "**/TestResults/*.trx"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Falha se houver dependência npm com severidade alta ou crítica
        run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida o compose com valores descartáveis
        run: |
          cp .env.example .env
          sed -i 's/^\(SA_PASSWORD\|JWT_KEY\|RABBITMQ_USER\|RABBITMQ_PASSWORD\)=.*/\1=valor-descartavel-0123456789/' .env
          docker compose config --quiet
      - name: Falha se houver segredo de desenvolvimento versionado
        run: |
          if git grep -nIE "Verx@Pass123|dev-only-(signing|internal)|Demo@12345" -- . ':!.github'; then
            echo "Segredo de desenvolvimento versionado."; exit 1
          fi
